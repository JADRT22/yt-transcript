[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-transcript"
version = "0.1.0"
description = "Busca a transcrição de vídeos do YouTube para agentes de IA: CLI + servidor MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando" }]
keywords = ["youtube", "transcript", "mcp", "ia", "agentes", "legendas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.12.13",
    "mcp[cli]>=1.2,<2",
]

[project.scripts]
yt-transcript = "yt_transcript.cli:main"
yt-transcript-mcp = "yt_transcript.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcript"]
