[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-transcript"
version = "0.2.0"
description = "Fetch YouTube video transcripts, descriptions and comments for AI agents: CLI + MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "JADRT22" }]
keywords = ["youtube", "transcript", "mcp", "ai", "agents", "captions", "yt-dlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.12.13",
    "mcp[cli]>=1.2,<2",
]

[project.scripts]
yt-transcript = "yt_transcript.cli:main"
yt-transcript-mcp = "yt_transcript.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcript"]
